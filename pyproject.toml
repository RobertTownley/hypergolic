[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hypergolic"
version = "0.46.4"
description = "An AI-powered coding assistant"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.0",
    "anthropic[bedrock]==1.15.0",
    "asyncpg==0.32.0",
    "certifi==2026.7.22",
    "fastapi==0.143.3",
    "greenlet==3.5.6",
    "httpx2==2.13.1",
    "mcp==2.3.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-sqlalchemy==0.66b1",
    "opentelemetry-sdk==1.45.1",
    "pillow==12.3.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "python-multipart==0.0.32",
    "pywebview==6.2.1",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "ruff==0.16.8",
    "sqlalchemy==2.0.54",
    "truststore==0.10.5",
    "ty==0.0.82",
    "typer==0.27.3",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=1.0",
    "pytest-timeout>=2.0",
    "pytest-xdist",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
hypergolic = ["prompts/**/*.md", "alembic.ini", "alembic/**/*", "ui_dist/**/*", "docs/*.md", "contrib/**/*.py", "contrib/**/*.md", "contrib/**/*.yaml", "contrib/.gitignore"]

[project.scripts]
hypergolic = "hypergolic.cli.app:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 0.5
pythonpath = ["."]
addopts = "-q --no-header --tb=short --import-mode=importlib"
markers = ["db: runs against Postgres instead of the in-memory tables (DB-layer tests only)"]

[tool.coverage.run]
omit = [
    "hypergolic/cli/app.py",
    "hypergolic/cli/launch.py",
    "hypergolic/cli/update_cmd.py",
    "hypergolic/cli/doctor_cmd.py",
    "hypergolic/mcptools/oauth.py",
    "hypergolic/alembic/*",
]

[tool.ruff]
exclude = ["hypergolic/contrib/main_template.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"hypergolic/__init__.py" = ["E402"]

[tool.ty.src]
exclude = ["sample_invocation.py", "hypergolic/contrib/main_template.py"]

[tool.ty.environment]
extra-paths = ["."]

[tool.uv]
add-bounds = "exact"
exclude-newer = "1 week"

