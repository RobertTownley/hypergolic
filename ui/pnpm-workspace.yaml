# pnpm configuration for the Hypergolic UI.
#
# enableGlobalVirtualStore: symlink dependencies from a single shared store
# outside the project instead of hardlinking them into node_modules/.pnpm.
# This makes `node_modules` ~kb instead of ~hundreds of MB, so git worktrees
# seed near-instantly for multi-agent workflows.
# See: https://pnpm.io/next/recipes/pnpm-worktrees
#
# The other three settings below exist to support the global virtual store:
#
# - @pnpm/plugin-esm-node-path: pnpm relies on NODE_PATH to make hoisted
#   deps resolvable, but ESM in Node.js ignores NODE_PATH. This plugin
#   registers an ESM loader that restores that behavior at runtime.
# - packageExtensions: patches `@testing-library/jest-dom` whose ESM build
#   imports `vitest` without declaring it, so pnpm knows to keep vitest
#   reachable from jest-dom.
#
# minimumReleaseAge: require packages to be at least 7 days old before
# installing, to mitigate supply chain attacks by giving time for
# compromised versions to be discovered and removed.

configDependencies:
  '@pnpm/plugin-esm-node-path': 0.1.2+sha512-KzcFbJpNJHRZ60GpXmc6CoBX/zjy+fKEf/OOYdRbAlxV/Kf/f6pDNUDIVTQU8a5DHt6ODXq5mndwJPlryqMj1A==

enableGlobalVirtualStore: true

minimumReleaseAge: 10080

packageExtensions:
  '@testing-library/jest-dom':
    dependencies:
      vitest: '*'
